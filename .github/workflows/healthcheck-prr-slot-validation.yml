name: healthcheck-prr-slot-validation

on:
  push:
    branches: [ "feature/docker-healthchecks-upstream" ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/healthcheck-prr-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slot-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Slot regression tests
        run: |
          go test ./internal/adapter -run 'Test(SwarmRolloutSurgeSlotPromotedWhenOldPodDisappears|UncommittedReplacementIntentReservesSlotAfterDeleteCrash|SwarmPendingReplacementDoesNotStealPreexistingSurgePod|ConcurrentPendingReplacementPreservesReplicaSetProvenance|ConcurrentSameRevisionReplacementAssignmentDeterministic|ReplacementCandidateAllowsKubernetesSecondPrecisionTimestamp|ReplacementExcludesPreviouslyObservedSurgePodInSameSecond|SwarmTaskListPrefersCurrentPodOverTerminatingFormerSlotOwner|SwarmReplacementDeleteRequiresPodUIDPrecondition|SwarmReplacementCannotDeleteReusedPodName)$' -count=1 -v
      - name: Validate Go formatting of slot changes
        run: |
          echo '--- GOFMT DIFF BEGIN ---'
          gofmt -d internal/adapter/swarm_health_lifecycle.go internal/adapter/swarm_slot_reconciliation_test.go internal/adapter/swarm_slot_live_test.go internal/adapter/swarm_health_uid_fencing_test.go
          echo '--- GOFMT DIFF END ---'
          test -z "$(gofmt -l internal/adapter/swarm_health_lifecycle.go internal/adapter/swarm_slot_reconciliation_test.go internal/adapter/swarm_slot_live_test.go internal/adapter/swarm_health_uid_fencing_test.go)"
