name: validate

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for:"
            printf '%s\n' "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify network-isolation harness and manifest
        run: |
          bash -n hack/validate-network-isolation.sh
          grep -q 'resources: \["networkpolicies"\]' deploy/kubernetes.yaml
          grep -q 'resources: \["namespaces"\]' deploy/kubernetes.yaml
          grep -q 'resourceNames: \["d2k"\]' deploy/kubernetes.yaml
          grep -q 'type: ClusterIP' deploy/kubernetes.yaml
          grep -q 'verbs: \["get", "watch", "list", "patch"\]' deploy/kubernetes.yaml
          grep -q 'D2K_NETWORK_ISOLATION' deploy/kubernetes.yaml
          grep -q 'D2K_POD_CIDRS' deploy/kubernetes.yaml
          grep -q 'D2K_SERVICE_CIDRS' deploy/kubernetes.yaml
          grep -q 'D2K_REJECT_HOST_NETWORK' deploy/kubernetes.yaml


      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Build container image
        run: docker build -t d2k:validation .
