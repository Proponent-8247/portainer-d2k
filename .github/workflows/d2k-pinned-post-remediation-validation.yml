name: D2K Independent Pinned Post-Remediation Validation
on:
  push:
    branches:
      - review/pinned-health-validation-96d3f92
permissions:
  contents: read
jobs:
  go-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout validation branch (pinned Go source)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify pinned source parent and clean Go files
        run: |
          git cat-file -e 96d3f9209ac48dacacb5dd8330e6d86129eb674c^{commit}
          test "$(git diff --name-only 96d3f9209ac48dacacb5dd8330e6d86129eb674c HEAD)" = ".github/workflows/d2k-pinned-post-remediation-validation.yml"
      - name: gofmt -l .
        run: |
          gofmt -l . | tee /tmp/d2k-gofmt-list
          test ! -s /tmp/d2k-gofmt-list
      - name: go mod tidy strict clean diff
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go build ./...
        run: go build ./...
      - name: go test ./...
        run: go test ./...
      - name: go vet ./...
        run: go vet ./...
      - name: go test -race ./...
        run: go test -race ./...
  multiarch-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout validation branch (pinned Go source)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Verify pinned source parent and clean Go files
        run: |
          git cat-file -e 96d3f9209ac48dacacb5dd8330e6d86129eb674c^{commit}
          test "$(git diff --name-only 96d3f9209ac48dacacb5dd8330e6d86129eb674c HEAD)" = ".github/workflows/d2k-pinned-post-remediation-validation.yml"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build amd64 + arm64 OCI without registry push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=96d3f9209ac48dacacb5dd8330e6d86129eb674c
          outputs: type=oci,dest=/tmp/d2k-multiarch-prr.tar
      - name: Verify nonempty OCI output
        run: test -s /tmp/d2k-multiarch-prr.tar
