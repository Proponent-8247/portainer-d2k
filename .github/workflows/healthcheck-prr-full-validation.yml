name: healthcheck-prr-full-validation

on:
  push:
    branches: [ "feature/docker-healthchecks-upstream" ]

permissions:
  contents: read

jobs:
  golang:
    name: format-tidy-build-test-vet-race
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: Strict tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Build all
        run: go build ./...
      - name: Unit and integration tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        run: go test -race ./...

  multiarch:
    name: amd64-arm64-oci-local-context
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Setup Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build multi-arch OCI
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          push: false
          load: false
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          tags: d2k:healthcheck-prr
          outputs: type=oci,dest=/tmp/healthcheck-prr.tar
