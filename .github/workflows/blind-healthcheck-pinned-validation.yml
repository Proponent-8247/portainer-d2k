name: blind-healthcheck-pinned-validation

on:
  push:
    branches:
      - blind-validation-healthcheck-6e7d77e
  pull_request:

permissions:
  contents: read

jobs:
  exact-pinned-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact pinned candidate
        uses: actions/checkout@v4
        with:
          ref: 6e7d77eaca67e5684b35012714553fde81bdae39
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate exact pinned candidate
        shell: bash
        run: |
          set +e
          failures=0

          report() {
            local name="$1"
            local rc="$2"
            if [ "$rc" -eq 0 ]; then
              echo "::notice::$name: PASS"
            else
              echo "::error::$name: FAIL (exit $rc)"
              failures=1
            fi
          }

          actual="$(git rev-parse HEAD)"
          test "$actual" = "6e7d77eaca67e5684b35012714553fde81bdae39"
          report "exact SHA" "$?"

          fmt_files="$(gofmt -l .)"
          fmt_rc=0
          if [ -n "$fmt_files" ]; then
            printf 'gofmt would change:\n%s\n' "$fmt_files"
            fmt_rc=1
          fi
          report "gofmt" "$fmt_rc"

          go mod tidy
          tidy_cmd_rc=$?
          git diff --exit-code -- go.mod go.sum
          tidy_diff_rc=$?
          if [ "$tidy_cmd_rc" -eq 0 ] && [ "$tidy_diff_rc" -eq 0 ]; then tidy_rc=0; else tidy_rc=1; fi
          report "go mod tidy diff" "$tidy_rc"

          go build ./...
          report "go build ./..." "$?"

          go test ./...
          report "go test ./..." "$?"

          go vet ./...
          report "go vet ./..." "$?"

          go test -race ./...
          report "go test -race ./..." "$?"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output type=oci,dest=/tmp/d2k-image.tar \
            --tag d2k:blind-healthcheck-validation \
            .
          report "multi-arch OCI build" "$?"

          exit "$failures"
